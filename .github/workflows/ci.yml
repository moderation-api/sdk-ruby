# Maintained in moderation-api/sdk-generator (custom/ruby). Edits here are overwritten.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - run: bundle install
      - run: bundle exec rubocop --format github
      - run: gem build moderation_api.gemspec
      - name: Load the gem
        run: bundle exec ruby -Ilib -e 'require "moderation_api"; require "moderation_api/webhook_signature"; ModerationApi::ModerationApi; ModerationApi::WebhookSignature'
