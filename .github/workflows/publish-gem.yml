# Maintained in moderation-api/sdk-generator (custom/ruby). Edits here are overwritten.
name: Publish Gem
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
      - name: Check the release tag matches the gem version
        if: github.event_name == 'release'
        run: |
          version=$(ruby -e 'puts Gem::Specification.load("moderation_api.gemspec").version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match gem version $version"
            exit 1
          fi
      - run: gem build moderation_api.gemspec
      - run: gem push moderation_api-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.MODERATION_API_GEM_HOST_API_KEY || secrets.GEM_HOST_API_KEY }}
